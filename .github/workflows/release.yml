name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        name: Release (${{ matrix.goos }}/${{ matrix.goarch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                      runner: ubuntu-latest

                    - goos: linux
                      goarch: arm64
                      runner: ubuntu-24.04-arm

                    - goos: windows
                      goarch: amd64
                      runner: ubuntu-latest

                    - goos: windows
                      goarch: arm64
                      runner: ubuntu-latest

                    - goos: darwin
                      goarch: amd64
                      runner: ubuntu-latest

                    - goos: darwin
                      goarch: arm64
                      runner: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.26'

            - name: Set binary extension
              id: bin
              run: |
                  if [ "${{ matrix.goos }}" = "windows" ]; then
                    echo "ext=.exe" >> $GITHUB_OUTPUT
                  else
                    echo "ext=" >> $GITHUB_OUTPUT
                  fi

            - name: Build Discord bot
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: 0
              run: |
                  set -e

                  mkdir -p dist

                  go build -trimpath \
                    -ldflags="-s -w" \
                    -o dist/server-domme-discord${{ steps.bin.outputs.ext }} \
                    ./cmd/discord/

            - name: Prepare release bundle
              run: |
                  set -e

                  PKG_ROOT="server-domme-${{ matrix.goos }}-${{ matrix.goarch }}"
                  mkdir -p "${PKG_ROOT}"
                  cp start-discord.cmd start-discord.sh "${PKG_ROOT}/"
                  mkdir -p "${PKG_ROOT}/scripts"
                  cp scripts/ensure-build.cmd scripts/ensure-build.sh "${PKG_ROOT}/scripts/"
                  chmod +x "${PKG_ROOT}/"*.sh "${PKG_ROOT}/scripts/"*.sh
                  cp dist/* "${PKG_ROOT}/"
                  cp README.md LICENSE "${PKG_ROOT}/"
                  tar -c --exclude=docs/internal docs | tar -x -C "${PKG_ROOT}"
                  [ -f .env.example ] && cp .env.example "${PKG_ROOT}/.env"

                  mkdir -p "${PKG_ROOT}/data"
                  cp data/default_task.list.json "${PKG_ROOT}/data/"

                  [ -d assets ] && cp -R assets "${PKG_ROOT}/"
                  zip -r "dist/${PKG_ROOT}.zip" "${PKG_ROOT}"

            - name: Extract release notes from tag annotation
              id: tag
              run: |
                  git fetch --force --tags
                  {
                    echo "message<<TAG_NOTES_EOF"
                    git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}"
                    echo "TAG_NOTES_EOF"
                  } >> $GITHUB_OUTPUT

            - name: Publish release
              uses: softprops/action-gh-release@v2
              with:
                  body: ${{ steps.tag.outputs.message }}
                  files: dist/*.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
