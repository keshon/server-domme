name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

env:
    PROJECT_NAME: Server Domme
    PROJECT_DESCRIPTION: Discord bot for server management, roleplay tasks, confessions and scheduled channel cleanup.

jobs:
    release:
        name: Release (${{ matrix.goos }}/${{ matrix.goarch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                      runner: ubuntu-latest

                    - goos: linux
                      goarch: arm64
                      runner: ubuntu-24.04-arm

                    - goos: windows
                      goarch: amd64
                      runner: ubuntu-latest

                    - goos: windows
                      goarch: arm64
                      runner: ubuntu-latest

                    - goos: darwin
                      goarch: amd64
                      runner: ubuntu-latest

                    - goos: darwin
                      goarch: arm64
                      runner: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.26'

            - name: Set binary extension
              id: bin
              run: |
                  if [ "${{ matrix.goos }}" = "windows" ]; then
                    echo "ext=.exe" >> $GITHUB_OUTPUT
                  else
                    echo "ext=" >> $GITHUB_OUTPUT
                  fi

            - name: Build Discord bot
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: 0
              run: |
                  set -e

                  mkdir -p dist
                  BUILD_DATE=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
                  GIT_COMMIT=$(git rev-parse --short HEAD)

                  go build -trimpath \
                    -ldflags="-s -w \
                      -X github.com/keshon/buildinfo.Version=${GITHUB_REF_NAME} \
                      -X github.com/keshon/buildinfo.Commit=${GIT_COMMIT} \
                      -X github.com/keshon/buildinfo.BuildTime=${BUILD_DATE} \
                      -X 'github.com/keshon/buildinfo.Project=${{ env.PROJECT_NAME }}' \
                      -X 'github.com/keshon/buildinfo.Description=${{ env.PROJECT_DESCRIPTION }}'" \
                    -o dist/server-domme-discord${{ steps.bin.outputs.ext }} \
                    ./cmd/discord/

            - name: Prepare release bundle
              run: |
                  set -e

                  PKG_ROOT="server-domme-${{ matrix.goos }}-${{ matrix.goarch }}"
                  mkdir -p "${PKG_ROOT}"
                  cp dist/* "${PKG_ROOT}/"
                  cp README.md LICENSE "${PKG_ROOT}/"
                  [ -f .env.example ] && cp .env.example "${PKG_ROOT}/.env"

                  mkdir -p "${PKG_ROOT}/data"
                  cp data/default_task.list.json "${PKG_ROOT}/data/"

                  [ -d assets ] && cp -R assets "${PKG_ROOT}/"
                  zip -r "dist/${PKG_ROOT}.zip" "${PKG_ROOT}"

            - name: Extract release notes from tag annotation
              id: tag
              run: |
                  git fetch --force --tags
                  {
                    echo "message<<TAG_NOTES_EOF"
                    git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}"
                    echo "TAG_NOTES_EOF"
                  } >> $GITHUB_OUTPUT

            - name: Publish release
              uses: softprops/action-gh-release@v2
              with:
                  body: ${{ steps.tag.outputs.message }}
                  files: dist/*.zip
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
