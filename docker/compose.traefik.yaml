services:
  app:
    environment:
      SHORTLINK_BASE_URL: ${SHORTLINK_BASE_URL:?Set the public HTTPS origin in .env}
      SHORTLINK_ADDR: :8787
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-server-domme}.loadbalancer.server.port=8787
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-server-domme}-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-http}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-server-domme}-http.rule=Host(`${HOST:?Set the shortlink hostname in .env}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-server-domme}-http.middlewares=${COMPOSE_PROJECT_NAME:-server-domme}-to-https
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-server-domme}-to-https.redirectscheme.scheme=https
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-server-domme}.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:-https}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-server-domme}.rule=Host(`${HOST:?Set the shortlink hostname in .env}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-server-domme}.tls=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-server-domme}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
