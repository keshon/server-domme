services:
  app:
    container_name: ${ALIAS}
    restart: always
    image: '${ALIAS}-image'
    volumes:
      - ./data:/usr/project/data
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_GUILD_BLACKLIST=${DISCORD_GUILD_BLACKLIST}
      - STORAGE_PATH=${STORAGE_PATH:-/usr/project/data/store}
      - INIT_SLASH_COMMANDS=${INIT_SLASH_COMMANDS}
      - DEVELOPER_ID=${DEVELOPER_ID}
      - WS_SILENCE_TIMEOUT=${WS_SILENCE_TIMEOUT:-2m}
      - DISCORD_UNHEALTHY_MODE=${DISCORD_UNHEALTHY_MODE:-restart-session}
      - DISCORD_UNHEALTHY_GRACE=${DISCORD_UNHEALTHY_GRACE:-0}
      - DISCORD_UNHEALTHY_WINDOW=${DISCORD_UNHEALTHY_WINDOW:-1m}
      - COMMAND_TIMEOUT=${COMMAND_TIMEOUT:-30s}
      - COMMAND_PARALLELISM=${COMMAND_PARALLELISM:-16}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE:-}
      - LOG_MAX_SIZE_MB=${LOG_MAX_SIZE_MB:-10}
      - LOG_MAX_BACKUPS=${LOG_MAX_BACKUPS:-3}
      - LOG_MAX_AGE_DAYS=${LOG_MAX_AGE_DAYS:-0}
      - LOG_COMPRESS=${LOG_COMPRESS:-false}
      - TASKS_PATH=${TASKS_PATH}
      - PROTECTED_USERS=${PROTECTED_USERS}
      - SHORTLINK_BASE_URL=${SHORTLINK_BASE_URL}
      - SHORTLINK_ADDR=${SHORTLINK_ADDR:-:8787}
      - HEALTHCHECK_PATH=${HEALTHCHECK_PATH:-/ping}
      # Chat persona. Off unless CHAT_ENABLED is true, and then still silent
      # until an admin runs /chat channel. CHAT_CHARACTER_PATH points inside the
      # mounted volume, so data/character.md has to exist on the host next to
      # this file — without it the persona logs chat_character_load_failed and
      # stays off. Her memory (CHAT_MEMORY_PATH) is inside the same volume,
      # which is what lets her remember across deploys.
      - CHAT_ENABLED=${CHAT_ENABLED:-false}
      - CHAT_NAME=${CHAT_NAME:-Domme}
      - CHAT_CHARACTER_PATH=${CHAT_CHARACTER_PATH:-./data/character.md}
      - CHAT_USE_G4F=${CHAT_USE_G4F:-true}
      - CHAT_USE_POLLINATIONS=${CHAT_USE_POLLINATIONS:-false}
      - CHAT_G4F_PICKS=${CHAT_G4F_PICKS:-3}
      - CHAT_G4F_API_KEY=${CHAT_G4F_API_KEY}
      - CHAT_BASE_URL=${CHAT_BASE_URL}
      - CHAT_MODEL=${CHAT_MODEL}
      - CHAT_API_KEY=${CHAT_API_KEY}
      - CHAT_BACKENDS=${CHAT_BACKENDS}
      - CHAT_BACKEND_ORDER=${CHAT_BACKEND_ORDER:-priority}
      - CHAT_VOICE_BACKENDS=${CHAT_VOICE_BACKENDS}
      - CHAT_SELF_FACTS=${CHAT_SELF_FACTS:-true}
      - CHAT_EXAMPLES_SAMPLE=${CHAT_EXAMPLES_SAMPLE:-8}
      - CHAT_STYLE_CHECK=${CHAT_STYLE_CHECK:-true}
      - CHAT_FOLLOWUP_ON_SIGHT=${CHAT_FOLLOWUP_ON_SIGHT:-true}
      - CHAT_INTEREST=${CHAT_INTEREST:-true}
      - CHAT_SERENDIPITY=${CHAT_SERENDIPITY:-0}
      - CHAT_DRIFT=${CHAT_DRIFT:-0.25}
      - CHAT_BODY=${CHAT_BODY:-true}
      - CHAT_FEELINGS=${CHAT_FEELINGS:-true}
      - CHAT_IDLE_MIND=${CHAT_IDLE_MIND:-true}
      - CHAT_WALKS=${CHAT_WALKS:-true}
      - CHAT_IMPULSES=${CHAT_IMPULSES:-true}
      - CHAT_REACT_FIRST=${CHAT_REACT_FIRST:-true}
      - CHAT_REQUEST_TIMEOUT=${CHAT_REQUEST_TIMEOUT:-45s}
      - CHAT_TIMEZONE=${CHAT_TIMEZONE:-}
      - CHAT_MEMORY_PATH=${CHAT_MEMORY_PATH:-/usr/project/data/mind}
      - CHAT_REFLECT_HOUR=${CHAT_REFLECT_HOUR:-5}
      - CHAT_TEMPERATURE=${CHAT_TEMPERATURE:-}
      - CHAT_CASUAL_SLIPS=${CHAT_CASUAL_SLIPS:-0.2}
    # Lets the container reach a service listening on the host — an SSH
    # tunnel forwarding a home machine's LLM, for instance. Without it
    # "localhost" inside the container is the container, not the host.
    extra_hosts:
      - host.docker.internal:host-gateway
    entrypoint: /usr/project/app
    networks:
      - proxy
      - chat
    ports:
      - 8787
    labels:
      # HTTP to HTTPS redirection and middleware assignment
      - traefik.enable=true
      - traefik.http.routers.${ALIAS}-http.entrypoints=http
      - traefik.http.routers.${ALIAS}-http.rule=Host(`${HOST}`)
      - traefik.http.routers.${ALIAS}-http.middlewares=${ALIAS}-to-https,${ALIAS}-headers

      # HTTPS routing and TLS configuration
      - traefik.http.routers.${ALIAS}.entrypoints=https
      - traefik.http.routers.${ALIAS}.rule=Host(`${HOST}`)
      - traefik.http.routers.${ALIAS}.tls=true
      - traefik.http.routers.${ALIAS}.tls.certresolver=letsencrypt

      # Middleware for redirecting HTTP to HTTPS
      - traefik.http.middlewares.${ALIAS}-to-https.redirectscheme.scheme=https

  # Self-hosted gpt4free, reached only by the bot over the chat network.
  #
  # Started with `--profile g4f`, so an operator who does not want it runs
  # nothing extra. It is the same project behind the g4f.space relay, but run
  # here it talks to the upstream providers directly and has none of the
  # relay's per-IP credit accounting — which is what made that relay useless
  # from a server. Whether the providers themselves answer from this host is a
  # separate question, and the reason /chat status quotes backend errors.
  g4f:
    profiles: [g4f]
    container_name: ${ALIAS}-g4f
    image: hlohaus789/g4f:latest-slim
    restart: always
    # The image's own default is `python -m g4f --port 8080`, which its CLI no
    # longer accepts: --port moved under the `api` subcommand, so the bare 8080
    # is read as the mode, fails the choice check, and the exception handler
    # falls back to *tray* mode — which then dies on "Bad display name" looking
    # for an X server in a headless container. Naming the mode explicitly fixes
    # that and keeps working if upstream repairs its Dockerfile.
    #
    # Binding 0.0.0.0 rather than localhost is what lets the bot's container
    # reach it across the chat network.
    command: ["python", "-m", "g4f", "api", "--bind", "0.0.0.0:8080"]
    volumes:
      - ./data/g4f/har_and_cookies:/app/har_and_cookies
      - ./data/g4f/generated_media:/app/generated_media
    networks:
      - chat
    # Deliberately no ports and no traefik labels. This speaks the OpenAI API
    # with no authentication of its own, so anything that can reach it can
    # spend whatever quota the providers behind it allow. It stays on an
    # internal network, reachable from the bot and nothing else.

networks:
  proxy:
    external: true
  # A plain bridge rather than `internal: true`: g4f needs outbound access to
  # reach the providers it front-ends, and an internal network would leave it
  # able to answer the bot and unable to answer anything.
  chat:
    driver: bridge      