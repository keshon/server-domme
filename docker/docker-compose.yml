services:
  app:
    container_name: ${ALIAS}
    restart: always
    image: '${ALIAS}-image'
    volumes:
      - ./data:/usr/project/data
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_GUILD_BLACKLIST=${DISCORD_GUILD_BLACKLIST}
      - STORAGE_PATH=${STORAGE_PATH:-/usr/project/data/store}
      - INIT_SLASH_COMMANDS=${INIT_SLASH_COMMANDS}
      - DEVELOPER_ID=${DEVELOPER_ID}
      - WS_SILENCE_TIMEOUT=${WS_SILENCE_TIMEOUT:-2m}
      - DISCORD_UNHEALTHY_MODE=${DISCORD_UNHEALTHY_MODE:-restart-session}
      - DISCORD_UNHEALTHY_GRACE=${DISCORD_UNHEALTHY_GRACE:-0}
      - DISCORD_UNHEALTHY_WINDOW=${DISCORD_UNHEALTHY_WINDOW:-1m}
      - COMMAND_TIMEOUT=${COMMAND_TIMEOUT:-30s}
      - COMMAND_PARALLELISM=${COMMAND_PARALLELISM:-16}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FILE=${LOG_FILE}
      - LOG_MAX_SIZE_MB=${LOG_MAX_SIZE_MB:-10}
      - LOG_MAX_BACKUPS=${LOG_MAX_BACKUPS:-3}
      - LOG_MAX_AGE_DAYS=${LOG_MAX_AGE_DAYS:-0}
      - LOG_COMPRESS=${LOG_COMPRESS:-false}
      - TASKS_PATH=${TASKS_PATH}
      - PROTECTED_USERS=${PROTECTED_USERS}
      - SHORTLINK_BASE_URL=${SHORTLINK_BASE_URL}
      - SHORTLINK_ADDR=${SHORTLINK_ADDR:-:8787}
      - HEALTHCHECK_PATH=${HEALTHCHECK_PATH:-/ping}
      # Chat persona. Off unless CHAT_ENABLED is true, and then still silent
      # until an admin runs /chat here. CHAT_CHARACTER_PATH points inside the
      # mounted volume, so data/character.md has to exist on the host next to
      # this file — without it the persona logs chat_character_load_failed and
      # stays off.
      - CHAT_ENABLED=${CHAT_ENABLED:-false}
      - CHAT_NAME=${CHAT_NAME:-Domme}
      - CHAT_CHARACTER_PATH=${CHAT_CHARACTER_PATH:-./data/character.md}
      - CHAT_USE_G4F=${CHAT_USE_G4F:-true}
      - CHAT_USE_POLLINATIONS=${CHAT_USE_POLLINATIONS:-false}
      - CHAT_G4F_PICKS=${CHAT_G4F_PICKS:-3}
      - CHAT_G4F_API_KEY=${CHAT_G4F_API_KEY}
      - CHAT_BASE_URL=${CHAT_BASE_URL}
      - CHAT_MODEL=${CHAT_MODEL}
      - CHAT_API_KEY=${CHAT_API_KEY}
      - CHAT_BACKENDS=${CHAT_BACKENDS}
      - CHAT_REQUEST_TIMEOUT=${CHAT_REQUEST_TIMEOUT:-45s}
      - CHAT_MENTION_CHANCE=${CHAT_MENTION_CHANCE:-0.88}
      - CHAT_NAMED_CHANCE=${CHAT_NAMED_CHANCE:-0.4}
      - CHAT_REPLY_CHANCE=${CHAT_REPLY_CHANCE:-0.92}
      - CHAT_FOLLOWUP_CHANCE=${CHAT_FOLLOWUP_CHANCE:-0.8}
    # Lets the container reach a service listening on the host — an SSH
    # tunnel forwarding a home machine's LLM, for instance. Without it
    # "localhost" inside the container is the container, not the host.
    extra_hosts:
      - host.docker.internal:host-gateway
    entrypoint: /usr/project/app
    networks:
      - proxy
    ports:
      - 8787
    labels:
      # HTTP to HTTPS redirection and middleware assignment
      - traefik.enable=true
      - traefik.http.routers.${ALIAS}-http.entrypoints=http
      - traefik.http.routers.${ALIAS}-http.rule=Host(`${HOST}`)
      - traefik.http.routers.${ALIAS}-http.middlewares=${ALIAS}-to-https,${ALIAS}-headers

      # HTTPS routing and TLS configuration
      - traefik.http.routers.${ALIAS}.entrypoints=https
      - traefik.http.routers.${ALIAS}.rule=Host(`${HOST}`)
      - traefik.http.routers.${ALIAS}.tls=true
      - traefik.http.routers.${ALIAS}.tls.certresolver=letsencrypt

      # Middleware for redirecting HTTP to HTTPS
      - traefik.http.middlewares.${ALIAS}-to-https.redirectscheme.scheme=https

networks:
  proxy:
    external: true      